
services:
  # 1. Le Message Broker (Redis)
  # Il reçoit les tâches de Django et les met en file d'attente pour Celery
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: always

  # 2. Le Serveur Web (Django)
  # Expose l'API REST
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app  # Synchronise le code local avec le conteneur (Hot-Reloading)
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis

  # 3. Le Worker Asynchrone (Celery)
  # Exécute l'extraction OpenCV/Tesseract en arrière-plan sans bloquer l'API
  celery:
    build: .
    command: celery -A core worker --loglevel=info
    volumes:
      - .:/app  # Partage le même code source que le web
    env_file:
      - .env
    depends_on:
      - redis
      - web
